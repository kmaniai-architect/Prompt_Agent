<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  /* dark: solid, layered surfaces (page < side/header < card < field) */
  --bg:#0b0e14; --hdr:#10141c; --side:#0f131a; --card:#151a24; --field:#1c2230; --code:#0f131b;
  --glass:#151a24; --glass2:#222a3a;
  --line:#2a3242; --line-strong:#3a4358; --text:#e8ebf3; --muted:#a0a9bd;
  --a1:#8b7bff; --a2:#38d0ee; --a3:#f472b6; --good:#4ade80; --warn:#fbbf24; --bad:#fb7185;
  --shadow:0 12px 32px -16px rgba(0,0,0,.65); --blob-op:.14; --glow:.1;
}
[data-theme=light]{
  --bg:#f4f5fb; --hdr:rgba(255,255,255,.75); --side:rgba(255,255,255,.7); --card:rgba(255,255,255,.85);
  --field:rgba(20,24,60,.05); --code:rgba(20,24,60,.05);
  --glass:rgba(255,255,255,.7); --glass2:rgba(255,255,255,.95);
  --line:rgba(20,24,60,.1); --line-strong:rgba(20,24,60,.22); --text:#161a33; --muted:#656b8a;
  --a1:#7c5cff; --a2:#0891b2; --good:#16a34a; --warn:#d97706; --bad:#e11d48;
  --shadow:0 20px 50px -25px rgba(40,40,120,.35); --blob-op:.18; --glow:.16;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.55 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}

/* animated backdrop */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:var(--blob-op);animation:float 22s ease-in-out infinite}
.b1{background:var(--a1);top:-15%;left:-10%}
.b2{background:var(--a2);bottom:-20%;right:-8%;animation-delay:-8s}
.b3{background:var(--a3);top:35%;left:45%;width:28vmax;height:28vmax;animation-delay:-14s}

.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);opacity:.18}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,4vmax) scale(1.12)}66%{transform:translate(-4vmax,7vmax) scale(.92)}}

.app{position:relative;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--hdr)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 0 24px -2px var(--a1);animation:pulseLogo 4s ease-in-out infinite}
@keyframes pulseLogo{50%{box-shadow:0 0 34px 2px var(--a2)}}
.logo svg{width:18px;height:18px}
h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:ping 2s infinite}
.dot.off{background:var(--warn);--c:var(--warn)}
@keyframes ping{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--glass);cursor:pointer;display:grid;place-items:center;transition:.25s}
.icon-btn:hover{transform:rotate(18deg) scale(1.08);background:var(--glass2)}

.layout{display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--side)}
.side-top{padding:16px;display:grid;gap:12px}
.search{position:relative}
.search input{width:100%;padding:10px 54px 10px 36px;border-radius:12px;border:1px solid var(--line-strong);background:var(--field);outline:none;transition:.25s}
.search input:focus{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 22%,transparent)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;opacity:.55}
kbd{position:absolute;right:9px;top:8px;font:500 11px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.list{overflow:auto;padding:4px 12px 20px;display:grid;gap:8px;align-content:start}
.item{position:relative;padding:12px 14px;border-radius:14px;border:1px solid transparent;background:transparent;cursor:pointer;transition:.28s cubic-bezier(.2,.8,.2,1);opacity:0;transform:translateX(-14px);animation:slideIn .5s forwards}
@keyframes slideIn{to{opacity:1;transform:none}}
.item:hover{background:var(--glass2);border-color:var(--line);transform:translateX(4px)}
.item.active{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 22%,transparent),color-mix(in srgb,var(--a2) 10%,transparent));border-color:color-mix(in srgb,var(--a1) 55%,transparent)}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:12px}
.item .x{position:absolute;right:8px;top:8px;opacity:0;transition:.2s;border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}
.item:hover .x{opacity:.9}.item .x:hover{background:rgba(251,113,133,.15)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

main{overflow:auto;padding:34px clamp(18px,4vw,56px) 80px;scroll-behavior:smooth}
.view{max-width:940px;margin:0 auto;animation:viewIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(18px)}}
.hero h2{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.035em;line-height:1.1}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.hero p{color:var(--muted);margin:10px 0 22px;max-width:620px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-size:12.5px;transition:.25s}
.chip:hover{border-color:var(--a1);transform:translateY(-2px);background:var(--glass2)}

.card{position:relative;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:22px;margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden;--mx:50%;--my:0%}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx) var(--my),color-mix(in srgb,var(--a1) calc(var(--glow) * 100%),transparent),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fields .full{grid-column:1/-1}
.fld{position:relative}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;transition:.2s}
.fld:focus-within label{color:var(--a2)}
.fld input,.fld textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--field);outline:none;resize:vertical;transition:.25s}
.fld textarea{min-height:84px}
.fld input:focus,.fld textarea:focus{border-color:var(--a2);box-shadow:0 0 0 4px color-mix(in srgb,var(--a2) 18%,transparent)}
.fld small{color:var(--muted);font-size:11.5px;display:block;margin-top:4px}

.btn{position:relative;overflow:hidden;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);cursor:pointer;font-weight:600;transition:.25s}
.btn:hover{transform:translateY(-2px);border-color:var(--a1)}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;color:#fff;background:linear-gradient(120deg,var(--a1),#5b8cff 50%,var(--a2));background-size:200% 100%;box-shadow:0 10px 30px -10px var(--a1)}
.btn.primary:hover{background-position:100% 0;box-shadow:0 14px 36px -8px var(--a2)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.6;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.err{color:var(--bad);margin-top:12px;font-weight:500}

/* agent pipeline */
.pipe{display:flex;align-items:center;justify-content:center;gap:0;padding:14px 0 6px;flex-wrap:wrap}
.node{display:grid;justify-items:center;gap:8px;width:110px;opacity:.4;transition:.4s}
.node .orb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:1px solid var(--line);background:var(--glass2);position:relative}
.node.on{opacity:1}
.node.on .orb{border-color:var(--a2);box-shadow:0 0 0 0 var(--a2);animation:orb 1.6s infinite}
.node.done{opacity:1}.node.done .orb{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.node.done .orb::after{content:"✓";position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#04130c;font-size:12px;font-weight:800;display:grid;place-items:center;animation:pop .4s}
@keyframes orb{70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pop{from{transform:scale(0)}}
.node span{font-size:12px;font-weight:600}
.link{width:60px;height:2px;background:var(--line);position:relative;overflow:hidden;margin-bottom:22px}
.link.on::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--a2),transparent);animation:flow 1s linear infinite}
@keyframes flow{from{left:-40%}to{left:100%}}
.status-line{text-align:center;color:var(--muted);min-height:22px;font-size:13px}
.status-line i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--a2);margin:0 2px;animation:bounce 1s infinite}
.status-line i:nth-child(2){animation-delay:.15s}.status-line i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-5px);opacity:.4}}

/* prompt view */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 6px}
.kv{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--field);transition:.3s;animation:viewIn .6s backwards}
.kv:hover{transform:translateY(-3px);border-color:var(--a1)}
.kv small{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--a2);margin-bottom:3px}
.secs{display:grid;gap:10px}
.sec{border-radius:14px;border:1px solid var(--line);background:var(--code);border-left:3px solid var(--c,var(--a1));overflow:hidden;opacity:0;transform:translateY(12px);animation:slideUp .55s forwards}
@keyframes slideUp{to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;user-select:none}
.sec-h .tag{color:var(--c,var(--a1))}
.sec-h .chev{margin-left:auto;transition:.3s;color:var(--muted)}
.sec.closed .chev{transform:rotate(-90deg)}
.sec-b{padding:0 14px 14px;white-space:pre-wrap;font:13px/1.65 'JetBrains Mono',monospace;color:var(--text);max-height:600px;transition:.4s ease;overflow:hidden}
.sec.closed .sec-b{max-height:0;padding-bottom:0}
.newb{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:linear-gradient(90deg,var(--a3),var(--a1));color:#fff;letter-spacing:.06em;animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 12px var(--a3)}}
pre.raw{white-space:pre-wrap;font:13px/1.65 'JetBrains Mono',monospace;background:var(--code);border:1px solid var(--line);padding:16px;border-radius:14px}
.tabs{display:inline-flex;padding:4px;border-radius:12px;background:var(--field);border:1px solid var(--line);position:relative;margin-bottom:14px}
.tab{position:relative;z-index:1;padding:6px 14px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:.25s;border-radius:9px}
.tab.on{color:#fff;background:linear-gradient(120deg,var(--a1),var(--a2))}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* score */
.top-an{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:36px;font-weight:800;letter-spacing:-.04em}
.ring .num small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-6px}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}
.lbox{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--field)}
.lbox h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.lbox li{list-style:none;padding:4px 0 4px 20px;position:relative;opacity:0;animation:slideUp .5s forwards}
.lbox li::before{content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.tagrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.tg{padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--glass2)}
.intent{color:var(--muted);margin-top:6px}.intent b{color:var(--text)}

.strats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.strat{position:relative;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--field);cursor:pointer;transition:.25s cubic-bezier(.2,.8,.2,1)}
.strat:hover{transform:translateY(-3px);border-color:var(--a1)}
.strat .ic{font-size:20px;display:block;margin-bottom:4px;transition:.3s}
.strat:hover .ic{transform:scale(1.2) rotate(-6deg)}
.strat b{display:block;font-size:13.5px}
.strat small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.strat em{display:block;font-style:normal;font-size:11px;color:var(--a2);margin-top:6px}
.strat.on{border-color:var(--a1);background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 24%,transparent),color-mix(in srgb,var(--a2) 10%,transparent));box-shadow:0 8px 28px -12px var(--a1)}
.strat.on::after{content:"✓";position:absolute;right:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--a1);color:#fff;font-size:12px;display:grid;place-items:center;animation:pop .35s}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--field);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:.25s;text-align:center}
.seg button small{display:block;font-weight:500;font-size:11px;opacity:.8}
.seg button.on{background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;box-shadow:0 6px 18px -8px var(--a1)}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.stat{padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--glass2)}
.stat.s{color:var(--a2)}.stat.w{color:var(--good)}.stat.t{color:var(--warn)}
.sect-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin:20px 0 8px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);opacity:0;padding:11px 18px;border-radius:12px;background:var(--glass2);border:1px solid var(--a2);backdrop-filter:blur(16px);z-index:99;transition:.4s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;color:var(--muted);margin-top:14px}
.msg{margin-top:10px}.msg b{color:var(--a2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.msg pre{margin-top:4px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
@media(max-width:860px){.layout{grid-template-columns:1fr;grid-template-rows:auto}.app{grid-template-rows:auto auto}aside{max-height:230px;border-right:0;border-bottom:1px solid var(--line)}.fields,.split,.top-an{grid-template-columns:1fr}body{overflow:auto}.app{height:auto}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid-bg"></div></div>
<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg></div>
    <h1>Prompt <span>Studio</span></h1>
    <span class="pill"><i class="dot" id="dot"></i><span id="status">connecting…</span></span>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" title="Toggle theme">🌗</button>
  </header>
  <div class="layout">
    <aside>
      <div class="side-top">
        <button class="btn primary" id="newBtn">＋ New prompt</button>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="q" placeholder="Search prompts…" autocomplete="off"><kbd>Ctrl K</kbd>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const el=(t,p={},...k)=>{const n=document.createElement(t);
  for(const[key,v]of Object.entries(p))key.startsWith('data-')?n.setAttribute(key,v):n[key]=v;
  k.flat().forEach(x=>n.append(x));return n};
const API_BASE=location.protocol==='file:'?'http://127.0.0.1:8000':'';
async function api(path,opts={}){
  const r=await fetch(API_BASE+'/api'+path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.statusText);
  return r.json();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let prompts=[],activeId=null,filter='',catalog={strategies:[],lengths:[]};
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const stratLabel=id=>catalog.strategies.find(s=>s.id===id)?.label||id;
const statChips=(text,strategy)=>el('div',{className:'stat-row'},
  strategy?el('span',{className:'stat s',textContent:`${(catalog.strategies.find(s=>s.id===strategy)||{}).icon||''} ${stratLabel(strategy)}`}):'',
  el('span',{className:'stat w',textContent:`${words(text)} words`}),
  el('span',{className:'stat t',textContent:`≈ ${Math.round(words(text)*1.35)} tokens`}));

/* ---------- helpers ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}
function copy(text,msg='Copied to clipboard'){navigator.clipboard.writeText(text).then(()=>toast('✓ '+msg))}
function countUp(node,to,ms=1200){const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/ms);node.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)}
const COLORS=['#7c5cff','#22d3ee','#f472b6','#34d399','#fbbf24','#60a5fa','#fb7185'];
function parseSections(t){
  const parts=t.split(/^#{1,3}\s+(.+)$/m);
  if(parts.length<3)return[{title:'Prompt',body:t.trim()}];
  const out=[];if(parts[0].trim())out.push({title:'Preamble',body:parts[0].trim()});
  for(let i=1;i<parts.length;i+=2)out.push({title:parts[i].trim(),body:(parts[i+1]||'').trim()});
  return out;
}
function sectionsView(text,existing){
  const secs=parseSections(text),wrap=el('div',{className:'secs'});
  secs.forEach((s,i)=>{
    const isNew=existing&&!existing.has(s.title.toLowerCase());
    const box=el('div',{className:'sec',style:`--c:${COLORS[i%COLORS.length]};animation-delay:${i*90}ms`},
      el('div',{className:'sec-h',onclick:()=>box.classList.toggle('closed')},
        el('span',{className:'tag',textContent:'#'}),s.title,isNew?el('span',{className:'newb',textContent:'NEW'}):'',el('span',{className:'chev',textContent:'▾'})),
      el('div',{className:'sec-b',textContent:s.body}));
    wrap.append(box);
  });
  return wrap;
}
function pipeline(names){
  const root=el('div');const nodes=names.map(([ic,n])=>el('div',{className:'node'},el('div',{className:'orb',textContent:ic}),el('span',{textContent:n})));
  const links=nodes.slice(1).map(()=>el('div',{className:'link'}));
  const line=el('div',{className:'pipe'});nodes.forEach((n,i)=>{line.append(n);if(links[i])line.append(links[i])});
  const status=el('div',{className:'status-line'});
  root.append(line,status);
  root.step=async(i,msg)=>{nodes.forEach((n,j)=>{n.classList.toggle('done',j<i);n.classList.toggle('on',j===i)});links.forEach((l,j)=>l.classList.toggle('on',j===i-1||j===i));status.replaceChildren(msg,el('i'),el('i'),el('i'))};
  root.finish=()=>{nodes.forEach(n=>{n.classList.remove('on');n.classList.add('done')});links.forEach(l=>l.classList.remove('on'));status.textContent='Done'};
  return root;
}

/* global micro-interactions: card spotlight + button ripple */
document.addEventListener('mousemove',e=>{const c=e.target.closest?.('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}});
document.addEventListener('click',e=>{const b=e.target.closest?.('.btn');if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height);
  b.append(el('span',{className:'ripple',style:`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`}));setTimeout(()=>$('.ripple',b)?.remove(),600)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}});

try{if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme}catch{}
$('#q').oninput=e=>{filter=e.target.value.toLowerCase();renderList()};

/* ---------- sidebar ---------- */
function renderList(){
  const list=$('#list');list.replaceChildren();
  const shown=prompts.filter(p=>(p.title+p.role+p.context+p.prompt).toLowerCase().includes(filter));
  if(!shown.length)list.append(el('div',{className:'empty',textContent:prompts.length?'No matches':'No prompts yet — create your first one ✨'}));
  shown.forEach((p,i)=>{
    const del=el('button',{className:'x',title:'Delete',textContent:'✕',onclick:async e=>{e.stopPropagation();if(!confirm('Delete this prompt?'))return;await api('/prompts/'+p.id,{method:'DELETE'});if(activeId===p.id)showForm();await refresh();toast('Deleted')}});
    list.append(el('div',{className:'item'+(p.id===activeId?' active':''),style:`animation-delay:${Math.min(i,10)*45}ms`,onclick:()=>showPrompt(p.id)},
      del,el('b',{textContent:p.title}),el('small',{textContent:`${p.created_at.slice(0,16).replace('T',' ')} · ${p.strategy?stratLabel(p.strategy)+' · ':''}${words(p.prompt)}w`})));
  });
}
async function refresh(){prompts=await api('/prompts');renderList()}

/* ---------- create view ---------- */
const EXAMPLES={
  'SQL tutor':{role:'a patient senior SQL tutor',context:'Students are beginners who already know Excel formulas',input:'{{question}} about SQL',output:'3 numbered steps, then one runnable example query with a one-line explanation'},
  'Code reviewer':{role:'a staff engineer doing pull-request review',context:'A Python backend team that values readability and test coverage',input:'{{diff}} of the pull request',output:'Bulleted findings grouped by severity (blocker / suggestion / nit), each with a line reference'},
  'Marketing copy':{role:'a senior conversion copywriter',context:'A B2B SaaS product launch aimed at busy operations managers',input:'{{product_description}} and {{audience}}',output:'3 headline options and a 50-word email intro in a confident, friendly tone'},
  'Support agent':{role:'an empathetic customer support specialist',context:'Handling refund and billing questions for an online subscription service',input:'{{customer_message}}',output:'A short reply under 120 words with an apology if needed, the next step and a clear close'}
};
async function typeInto(inp,text){inp.value='';for(const c of text){inp.value+=c;await sleep(7)}}
/* which input fields each strategy needs */
const FIELD_RULES={
  'auto':['input'],
  'zero-shot':['context'],
  'few-shot':['context','input','output'],
  'role-based':['role','context','input'],
  'task-based':['context','input','output'],
  'chain-of-thought':['context','input','output'],
  'structured':['context','input','output']
};
const FIELD_NAMES=['role','context','input','output'];
const HINTS={
  auto:{input:'Describe what you need — the agent works out the role, context and output'},
  'zero-shot':{context:'Describe the task and any background in a few lines'}
};
function showForm(){
  activeId=null;renderList();
  const form=el('form');
  const F=(name,label,hint,rows,full)=>el('div',{className:'fld'+(full?' full':''),'data-field':name},el('label',{textContent:label,htmlFor:'f_'+name}),
    rows?el('textarea',{name,id:'f_'+name,rows,required:true}):el('input',{name,id:'f_'+name,required:name!=='title'}),el('small',{textContent:hint}));
  const DEFAULT_HINTS={role:'Who should the model act as?',context:'Background, audience and goal',input:'What the prompt receives — use {{placeholders}}',output:'Format, length, tone, structure'};
  const visibleFields=()=>FIELD_RULES[strategy]||FIELD_NAMES;
  const chips=el('div',{className:'chips'},el('span',{textContent:'Try an example:',style:'color:var(--muted);font-size:12.5px'}),
    Object.entries(EXAMPLES).map(([k,v])=>el('button',{type:'button',className:'chip',textContent:k,onclick:async()=>{for(const n of visibleFields())await typeInto(form[n],v[n])}})));
  let strategy='auto',length='balanced';
  const exBox=F('examples','Your examples (optional)','Used by few-shot: one "Input: … Output: …" pair per block',3,1);
  exBox.style.cssText='display:none;margin-top:14px';
  exBox.querySelector('textarea').required=false;
  const stratGrid=el('div',{className:'strats'});
  const drawStrats=()=>{stratGrid.replaceChildren(...catalog.strategies.map(s=>el('button',{type:'button',className:'strat'+(s.id===strategy?' on':''),
    onclick:()=>{strategy=s.id;drawStrats();applyFields()}},
    el('span',{className:'ic',textContent:s.icon}),el('b',{textContent:s.label}),el('small',{textContent:s.desc}),el('em',{textContent:s.best_for}))))};
  const lenSeg=el('div',{className:'seg'});
  const drawLen=()=>{lenSeg.replaceChildren(...catalog.lengths.map(l=>el('button',{type:'button',className:l.id===length?'on':'',
    onclick:()=>{length=l.id;drawLen()}},l.label,el('small',{textContent:l.desc}))))};
  const fieldsBox=el('div',{className:'fields'},
    F('role','Role','',0),F('title','Title (optional)','Shown in your library',0),
    F('context','Context','',3,1),F('input','Input','',3),F('output','Required output','',3));
  /* show only the fields the chosen strategy needs; hidden ones are never required or sent */
  const applyFields=()=>{
    const vis=visibleFields();
    FIELD_NAMES.forEach(n=>{
      const box=$(`[data-field=${n}]`,fieldsBox),on=vis.includes(n);
      box.style.display=on?'':'none';
      box.querySelector('input,textarea').required=on;
      box.querySelector('small').textContent=(HINTS[strategy]||{})[n]||DEFAULT_HINTS[n];
      if(on){box.style.animation='none';box.offsetHeight;box.style.animation='viewIn .45s backwards'}
    });
    const pair=(a,b)=>{const both=vis.includes(a)&&vis.includes(b);$(`[data-field=${a}]`,fieldsBox).classList.toggle('full',!both);$(`[data-field=${b}]`,fieldsBox).classList.toggle('full',!both)};
    pair('input','output');
    $('[data-field=role]',fieldsBox).classList.remove('full');$('[data-field=title]',fieldsBox).classList.remove('full');
    $('[data-field=context]',fieldsBox).classList.add('full');
    exBox.style.display=strategy==='few-shot'?'block':'none';
  };
  drawStrats();drawLen();applyFields();
  const msg=el('div',{style:'flex:1;min-width:240px'}),err=el('div',{className:'err'});
  const go=el('button',{className:'btn primary',type:'submit',textContent:'✨ Generate prompt'});
  form.append(
    el('div',{className:'sect-label',style:'margin-top:0',textContent:'1 · Prompt strategy'}),stratGrid,
    el('div',{className:'sect-label',textContent:'2 · Prompt length'}),lenSeg,
    el('div',{className:'sect-label',textContent:'3 · Describe your prompt'}),
    fieldsBox,
    exBox,
    el('div',{className:'row',style:'margin-top:18px'},go,el('span',{style:'color:var(--muted);font-size:12px',textContent:'Ctrl + Enter to submit'})),err);
  form.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')form.requestSubmit()};
  const pipe=pipeline([['✍️','Drafter'],['🔍','Reviewer'],['✅','Final prompt']]);
  const pipeCard=el('div',{className:'card',style:'display:none'},el('h3',{textContent:'Agents at work'}),pipe);
  form.onsubmit=async e=>{
    e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Generating…';pipeCard.style.display='block';
    let done=false;
    const anim=(async()=>{await pipe.step(0,'Drafter is writing the first version');await sleep(2800);if(done)return;
      await pipe.step(1,'Reviewer is critiquing for gaps and ambiguity');await sleep(3200);if(done)return;await pipe.step(1,'Drafter is revising from feedback')})();
    try{
      const all=Object.fromEntries(new FormData(form)),vis=visibleFields();
      const body={title:all.title||'',examples:strategy==='few-shot'?(all.examples||''):'',strategy,length};
      FIELD_NAMES.forEach(n=>body[n]=vis.includes(n)?all[n]:'');
      const p=await api('/prompts/generate',{method:'POST',body:JSON.stringify(body)});
      done=true;await anim.catch(()=>{});pipe.finish();await sleep(550);
      activeId=p.id;await refresh();toast('✓ Prompt generated and saved');showPrompt(p.id);
    }catch(ex){done=true;err.textContent=ex.message;go.disabled=false;go.textContent='✨ Generate prompt';pipeCard.style.display='none'}
  };
  $('#main').replaceChildren(el('div',{className:'view'},
    el('div',{className:'hero'},el('h2',{},'Craft prompts that ',el('span',{className:'grad',textContent:'actually work'})),
      el('p',{textContent:'Describe the role, context, input and output you need. Two AutoGen agents draft and review it — then reverse-engineer any saved prompt into a stronger one.'})),
    chips,el('div',{className:'card'},form),pipeCard));
  $('#main').scrollTop=0;
}

/* ---------- prompt view ---------- */
const kv=(k,v,i)=>el('div',{className:'kv',style:`animation-delay:${i*80}ms`},el('small',{textContent:k}),el('div',{textContent:v}));
async function showPrompt(id){
  activeId=id;renderList();
  let p;try{p=await api('/prompts/'+id)}catch(ex){toast(ex.message);return}
  let raw=false;const holder=el('div');
  const draw=()=>holder.replaceChildren(raw?el('pre',{className:'raw',textContent:p.prompt}):sectionsView(p.prompt));
  const rawBtn=el('button',{className:'btn sm',textContent:'Raw view',onclick:()=>{raw=!raw;rawBtn.textContent=raw?'Sections':'Raw view';draw()}});
  draw();
  const revBox=el('div');
  const tr=p.transcript.length?el('details',{},el('summary',{textContent:`Agent conversation (${p.transcript.length} messages)`}),
    p.transcript.map(m=>el('div',{className:'msg'},el('b',{textContent:m.agent}),el('pre',{className:'raw',textContent:m.content})))):'';
  $('#main').replaceChildren(el('div',{className:'view'},
    el('div',{className:'card'},
      el('div',{className:'row between'},el('h3',{style:'font-size:20px;margin:0',textContent:p.title}),
        el('div',{className:'row'},rawBtn,el('button',{className:'btn sm',textContent:'Copy',onclick:()=>copy(p.prompt,'Prompt copied')}))),
      el('div',{className:'meta'},[['Role',p.role],['Context',p.context],['Input',p.input],['Required output',p.output]].filter(x=>x[1]).map((x,i)=>kv(x[0],x[1],i))),
      el('h3',{style:'margin:20px 0 0',textContent:'Generated prompt'}),statChips(p.prompt,p.strategy),el('div',{style:'height:10px'}),holder,tr),
    revBox));
  $('#main').scrollTop=0;
  runReverse(id,p.prompt,revBox,false);
}

async function runReverse(id,original,box,force){
  const pipe=pipeline([['🧪','Analyst'],['🛠️','Rewriter'],['🚀','Improved prompt']]);
  box.replaceChildren(el('div',{className:'card'},el('h3',{textContent:'Reverse engineering…'}),pipe));
  pipe.step(0,'Analyst is deconstructing intent, structure and gaps');
  const t=setTimeout(()=>pipe.step(1,'Rewriter is building the constructive version'),2600);
  let r;
  try{r=await api(`/prompts/${id}/reverse?force=${force}`,{method:'POST'})}
  catch(ex){clearTimeout(t);box.replaceChildren(el('div',{className:'card err',textContent:ex.message}));return}
  clearTimeout(t);pipe.finish();await sleep(450);
  if(activeId!==id)return;
  const a=r.analysis||{},weak=[...(a.weaknesses||[])],miss=a.missing||[],str=a.strengths||[];
  const score=Math.max(18,Math.min(98,100-weak.length*11-miss.length*9+Math.min(str.length,5)*2));
  const col=score>=75?'var(--good)':score>=50?'var(--warn)':'var(--bad)';
  const C=2*Math.PI*62;
  const ring=el('div',{className:'ring'});
  ring.innerHTML=`<svg width="150" height="150"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="75" cy="75" r="62" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px ${col})"/></svg><div class="num"><div><span id="n">0</span><small>strength</small></div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#arc',ring).style.strokeDashoffset=C*(1-score/100);countUp($('#n',ring),score)}));
  const L=(title,items,c)=>items.length?el('div',{className:'lbox',style:`--c:${c}`},el('h4',{style:`color:${c}`,textContent:title}),
    el('ul',{style:'padding:0'},items.map((x,i)=>el('li',{textContent:x,style:`animation-delay:${i*90+300}ms`})))):'';
  const dims=['inferred_role','inferred_context','inferred_input','inferred_output'].filter(k=>a[k]);
  const analysis=el('div',{className:'card'},el('h3',{textContent:'🔬 Reverse-engineered analysis'}),
    el('div',{className:'top-an'},ring,el('div',{},
      a.intent?el('div',{className:'intent'},el('b',{textContent:'Inferred intent  '}),a.intent):'',
      el('div',{className:'meta',style:'margin:12px 0 0'},dims.map((k,i)=>kv(k.replace('inferred_','').toUpperCase(),Array.isArray(a[k])?a[k].join('; '):String(a[k]),i))),
      (a.techniques||[]).length?el('div',{className:'tagrow'},a.techniques.map(x=>el('span',{className:'tg',textContent:x}))):'')),
    el('div',{className:'lists'},L('Strengths',str,'var(--good)'),L('Weaknesses',weak,'var(--warn)'),L('Missing',miss,'var(--bad)')));
  const origTitles=new Set(parseSections(original).map(s=>s.title.toLowerCase()));
  const view=el('div');let mode='improved';
  const tabs=el('div',{className:'tabs'});
  const draw=()=>{
    $$('.tab',tabs).forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    view.replaceChildren(mode==='improved'?sectionsView(r.improved_prompt,origTitles):mode==='original'?sectionsView(original):
      el('div',{className:'split'},el('div',{},el('h3',{style:'margin-bottom:10px;color:var(--muted)',textContent:'Original'}),sectionsView(original)),
        el('div',{},el('h3',{style:'margin-bottom:10px',textContent:'Improved'}),sectionsView(r.improved_prompt,origTitles))));
  };
  [['improved','✨ Improved'],['original','Original'],['split','Side by side']].forEach(([m,l])=>tabs.append(el('button',{className:'tab',textContent:l,'data-m':m,onclick:()=>{mode=m;draw()}})));
  draw();
  const out=el('div',{className:'card'},
    el('div',{className:'row between'},el('h3',{style:'margin:0',textContent:'🚀 Constructive prompt'}),
      el('div',{className:'row'},el('button',{className:'btn sm',textContent:'↻ Re-run',onclick:()=>runReverse(id,original,box,true)}),
        el('button',{className:'btn sm primary',textContent:'Copy improved',onclick:()=>copy(r.improved_prompt,'Improved prompt copied')}))),
    el('div',{className:'stat-row'},el('span',{className:'stat w',textContent:`${words(original)} → ${words(r.improved_prompt)} words`}),
      el('span',{className:'stat t',textContent:`≈ ${Math.round(words(r.improved_prompt)*1.35)} tokens`})),
    el('div',{style:'margin-top:12px'},tabs,view),
    (r.changes||[]).length?el('div',{className:'lists'},L('What changed',r.changes,'var(--a2)')):'',
    r.transcript?.length?el('details',{},el('summary',{textContent:'Agent conversation'}),r.transcript.map(m=>el('div',{className:'msg'},el('b',{textContent:m.agent}),el('pre',{className:'raw',textContent:m.content})))):'');
  box.replaceChildren(analysis,out);
}
